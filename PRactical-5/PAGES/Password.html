<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password</title>

    <link rel="stylesheet" href="/PRactical-5/CSS/Password.css">
</head>

<body>

    <header>

        <!-- Logo -->
        <img src="/PRactical-5/IMAGE/StudentHub-Logo.png" alt="StudentHub Logo">

        <!-- Dark / Light Mode -->
        <input type="checkbox" id="darkMode">

        <label for="darkMode" class="modeButton">
            🌙
        </label>

    </header>


    <main>

        <h1>Change Your Password</h1>

        <p>Enter the details below to change your password.</p>

        <form action="Pass1.html" method="get">

            <input
                type="password"
                placeholder="Enter Old Password"
            >

            <input
                type="password"
                placeholder="Enter New Password"
                required
            >

            <input
                type="password"
                placeholder="Confirm New Password"
                required
            >

            <input
                type="submit"
                value="Change Password"
            >

        </form>

    </main>


    <footer>
        © StudentHub_2026
    </footer>


</body>
</html>
