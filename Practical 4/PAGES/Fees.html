<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fees Page</title>
    <link rel="stylesheet" href="/Practical 4/CSS/Fees.css">
</head>
<body>

<input type="checkbox" id="theme-toggle">

<div class="page">

    <header>
        <img src="/Practical 4/IMAGE/StudentHub-Logo.png" alt="StudentHub Logo">

        <label for="theme-toggle" class="theme-switch">
            <span>☀</span>
            <span>🌙</span>
        </label>
    </header>

    <main>

        <h1>You can see and pay your fees here</h1>

        <div class="fees-container">

            <!-- Left Side Slider -->
            <div class="slider-box">

                <h2>Fees</h2>

                <div class="slider-section">

                    <button type="button" id="prev">❮</button>

                    <div class="slides">

                        <div class="slide active">
            <h3>Computer Engineering</h3>
            <p>Fee: ₹1,51,500</p>
        </div>

        <div class="slide">
            <h3>Civil Engineering</h3>
            <p>Fee: ₹1,00,000</p>
        </div>

        <div class="slide">
            <h3>Mechanical Engineering</h3>
            <p>Fee: ₹1,10,500</p>
        </div>

        <div class="slide">
            <h3>Electrical Engineering</h3>
            <p>Fee: ₹1,10,000</p>
        </div>

        <div class="slide">
            <h3>Chemical Engineering</h3>
            <p>Fee: ₹1,00,500</p>
        </div>

                    </div>

                    <button type="button" id="next">❯</button>

                </div>

            </div>

            <!-- Right Side Payment Form -->

            <div class="payment-box">

                <h2>Pay Fees Here</h2>

                <form action="Fees1.html" method="get">

                    <input type="text" placeholder="Enter Semester" required>
                    <br><br>

                    <input type="text" placeholder="Enter ID Number" required>
                    <br><br>

                    <input type="number" placeholder="Enter Amount" required>
                    <br><br>

                    <input type="submit" value="Pay Now">

                </form>

            </div>

        </div>

    </main>

    <footer>© StudentHub_2026</footer>

</div>

<script>
const slides = document.querySelectorAll(".slide");
const prev = document.getElementById("prev");
const next = document.getElementById("next");

let current = 0;

function showSlide(index){
    slides.forEach(slide => slide.classList.remove("active"));
    slides[index].classList.add("active");
}

next.addEventListener("click", function(){
    if(current < slides.length-1){
        current++;
        showSlide(current);
    }
});

prev.addEventListener("click", function(){
    if(current > 0){
        current--;
        showSlide(current);
    }
});
</script>

</body>
</html>
